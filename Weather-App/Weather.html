<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}
body {
  background: #6b949f;
  padding: 15px;
}
.container {
  background: #e0dddd;
  max-width: 600px;
  width: 100%;
  box-shadow: 10px 10px 20px rgb(0, 0, 0, 0.6);
  margin: 20px auto;
  margin-top: 40px;
  border-radius: 5px;
  text-align: center;
  padding: 20px;
}
form {
  display: flex;
  justify-content: space-around;
  align-items: center;
  text-align: center;
  margin: 30px;
  gap: 10px;
}
form input[type="text"] {
  padding: 18px;
  font-size: 18px;
  width: 70%;
  border: none;
  outline: none;
  border-radius: 5px;
}
form input[type="submit"] {
  padding: 10px 20px;
  border: none;
  background: #0c645a;
  color: white;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.3s ease-in;
  white-space: nowrap;
}
form input[type="submit"]:hover {
  background: rgb(175, 75, 75);
}
.icon img {
  width: 100px;
  height: 100px;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center center;
}
.temp {
  font-weight: 1000;
  font-size: 40px;
  margin-top: 30px;
}
.desc {
  font-size: 30px;
  font-weight: 700;
  margin-top: 10px;
  margin-bottom: 20px;
}
.details {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}
.details>div {
  font-size: 18px;
  background: #fff;
  padding: 20px;
  border-radius: 5px;
  margin: 10px;
  min-height: 40px;
  text-align: center;
  flex: 1;
}

/* RESPONSIVE - MOBILE KE LIYE */
@media (max-width: 600px) {
  body {
    padding: 10px;
  }
  .container {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
  }
  form {
    flex-direction: column;
    margin: 15px 0;
  }
  form input[type="text"] {
    width: 100%;
    padding: 14px;
    font-size: 16px;
  }
  form input[type="submit"] {
    width: 100%;
    padding: 14px;
  }
  .temp {
    font-size: 32px;
    margin-top: 15px;
  }
  .desc {
    font-size: 22px;
  }
  .details {
    flex-direction: column;
  }
  .details>div {
    width: 100%;
    margin: 5px 0;
    padding: 15px;
  }
}
</style>
</head>
<body>
<div class="container">
<h1>Weather App</h1>
<form action="">
<input id="city-name" type="text" placeholder="Enter your city name">
<input type="submit" value="Get Weather">
</form>
<div class="weather-data">
<div class="icon"></div>
<div class="temp"></div>
<div class="desc"></div>
<div class="details">
<div></div>
<div></div>
<div></div>
</div>
</div>
</div>
<script>
 const apiKey = "388f8270e852ae61dfd42e95a7e567e5"
const weatherDataEle = document.querySelector(".weather-data");
const cityName = document.querySelector("#city-name");
const formEle = document.querySelector("form");
const imgIcon = document.querySelector(".icon");

formEle.addEventListener("submit", function (e) {
  e.preventDefault();
  const cityValue = cityName.value;
  getWeatherData(cityValue);
});

async function getWeatherData(cityValue) {
  try {
    const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${cityValue}&appid=${apiKey}&units=metric`);
    if (!response.ok) {
      throw new Error("Network response is note ok!");
    }
    const data = await response.json();
    const temprature = Math.floor(data.main.temp);
    const description = data.weather[0].description;
    const icon = data.weather[0].icon;
    const details = [
      `Feels Like:${Math.floor(data.main.feels_like)}°C`,
      `Humidity :${data.main.humidity}%`,
      `Wind speed:${data.wind.speed}m/s`
    ];
    weatherDataEle.querySelector(".temp").textContent = `${temprature}°C`;
    weatherDataEle.querySelector(".desc").textContent = `${description}`;
    imgIcon.innerHTML = `<img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="">`;
    weatherDataEle.querySelector(".details").innerHTML = details.map((details) => {
      return `<div>${details}</div>`;
    }).join("");
  } catch (err) {
    weatherDataEle.querySelector(".temp").textContent = "";
    weatherDataEle.querySelector(".desc").textContent = "City not found!";
    weatherDataEle.querySelector(".details").innerHTML = "";
    imgIcon.innerHTML = "";
  }
}
</script>
</body>
</html>
